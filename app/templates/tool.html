{% extends "base.html" %}
{% block title %}{{ cfg.title }} — Transcreator{% endblock %}
{% block accent %}{{ cfg.accent }}{% endblock %}
{% block body %}
{% set god = cfg.mode == "god" %}
<header class="site-header">
  <div class="container">
    <a class="brand" href="/">
      <span class="brand-badge {{ 'godmode-heartbeat' if god }}">{{ "G" if god else "T" }}</span>
      <span>{{ cfg.title }}</span>
    </a>
    <span class="header-spacer"></span>
    <div class="header-actions">
      <a class="btn btn-sm btn-ghost" href="{{ cfg.modeLink.href }}">{{ cfg.modeLink.label }}</a>
      <button class="btn btn-sm btn-accent" id="btn-set-key" type="button">Set API Key</button>
      <a class="btn btn-sm" href="{{ cfg.keyLink }}" target="_blank" rel="noopener noreferrer">Get API Key ↗</a>
    </div>
  </div>
</header>

<main class="container tool-main stack">
  <!-- Controls -->
  <section class="glass-card card-pad">
    <div class="controls-grid">
      <div class="field model-field">
        <label class="field-label" for="model-select">Model</label>
        <div class="model-row">
          <select class="select" id="model-select"></select>
          <div class="token-meta-slider" id="token-meta" role="button" tabindex="0" title="Model info and pricing">
            <ul>
